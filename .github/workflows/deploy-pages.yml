name: Deploy reconstruction to GitHub Pages

# Publishes the reconstructed app (app/) as a static site at
# https://mithgan.github.io/NBAStockMarket/ so the recovered UI has a live
# URL again. Publishes via the classic gh-pages branch because the workflow
# token may not create a Pages site through the API. Only browser-safe public
# configuration is embedded in the static bundle.

on:
  push:
    branches: [claude/remote-control-v36xep, mith/experiments]
    paths: ['.github/workflows/deploy-pages.yml', 'app/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_NBA_STOCK_API_URL: https://api.databallr.com/api/nba-stock-market
      EXPO_PUBLIC_SUPABASE_URL: https://bvwahamwfvolchcezxnw.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2d2FoYW13ZnZvbGNoY2V6eG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc3NTYyMjQsImV4cCI6MjA1MzMzMjIyNH0.QTl2U94zdqe9DFEFTypJMVoeanjvGsZr1zJ7ovv5Ujk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Point the export at the Pages subpath
        working-directory: app
        run: |
          node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            config.expo.experiments = { ...config.expo.experiments, baseUrl: '/NBAStockMarket' };
            fs.writeFileSync('app.json', JSON.stringify(config, null, 2));
          "
      - name: Export web build
        working-directory: app
        run: npx expo export --platform web --output-dir dist
      - name: Add SPA fallback and disable Jekyll
        working-directory: app
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          force_orphan: true
          commit_message: 'deploy: reconstructed NBA Stock Market'
