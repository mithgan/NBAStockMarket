[project]
name = "nba-stock-market"
version = "0.1.0"
description = "Standalone NBA player stock-market pricing simulation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.7,<3",
    "pytest>=8.4,<10",
]

[tool.setuptools.packages.find]
include = ["nba_stock_market*"]
